name = "bai-gap-analysis"
main = "src/worker.js"
compatibility_date = "2026-10-30"

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "GAP_ANALYSIS_DB"
database_name = "bai-gap-production"
database_id = "24585639-21b0-4a44-bbb2-91b61daa317f"
migrations_dir = "./migrations"

[observability.logs]
enabled = true
invocation_logs = true
persist = true
