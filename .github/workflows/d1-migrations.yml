name: Apply Gap Analysis D1 migrations
# Trigger validation after Cloudflare token rotation

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "work/bai-gap/migrations/**"
      - ".github/workflows/d1-migrations.yml"

concurrency:
  group: bai-gap-production-d1-migrations
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: work/bai-gap
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply pending migrations to production D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "b27b7e8556ff44f7a76fa0e14f63ef66"
        run: npx --yes wrangler@4 d1 migrations apply bai-gap-production --remote
