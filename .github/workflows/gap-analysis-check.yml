name: Gap Analysis validation

on:
  pull_request:
    paths:
      - "work/bai-gap/**"
      - ".github/workflows/gap-analysis-check.yml"
  push:
    branches:
      - main
      - feature/gap-auth-rbac
    paths:
      - "work/bai-gap/**"
      - ".github/workflows/gap-analysis-check.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check frontend JavaScript syntax
        run: node --check work/bai-gap/dist/app.js

      - name: Check Pages Function syntax
        run: node --check 'work/bai-gap/functions/api/[[path]].js'

      - name: Verify Pages deployment files
        run: |
          test -f work/bai-gap/dist/index.html
          test -f work/bai-gap/dist/style.css
          test -f work/bai-gap/dist/app.js
          test -f work/bai-gap/migrations/0001_initial.sql
          grep -q 'main = "src/worker.js"' work/bai-gap/wrangler.toml
          grep -q 'directory = "./dist"' work/bai-gap/wrangler.toml
