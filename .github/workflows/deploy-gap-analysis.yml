name: Validate BAI Gap Analysis Worker

on:
  push:
    branches: [main]
    paths:
      - "work/bai-gap/**"
      - ".github/workflows/deploy-gap-analysis.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate JavaScript
        run: |
          node --check 'work/bai-gap/functions/api/[[path]].js'
          node --check work/bai-gap/src/worker.js
          node --check work/bai-gap/dist/app.js

      - name: Validate Worker configuration
        working-directory: work/bai-gap
        run: |
          test -f wrangler.toml
          test -f src/worker.js
          test -d dist
