name: Deploy BAI Gap Analysis Worker

on:
  push:
    branches: [main]
    paths:
      - "work/bai-gap/**"
      - ".github/workflows/deploy-gap-analysis.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate JavaScript
        run: |
          node --check 'work/bai-gap/functions/api/[[path]].js'
          node --check work/bai-gap/src/worker.js
          node --check work/bai-gap/dist/app.js

      - name: Deploy existing Worker
        working-directory: work/bai-gap
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: b27b7e8556ff44f7a76fa0e14f63ef66
        run: npx --yes wrangler@4 deploy --config wrangler.toml
